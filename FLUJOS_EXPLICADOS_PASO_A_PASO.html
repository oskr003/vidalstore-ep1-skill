<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>VidalStore EP1 — Guía Técnica Exhaustiva de Flujos de Punta a Punta</title>
  
  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Marked para Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Mermaid para Diagramas de Secuencia -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <!-- Highlight.js para Sintaxis de Código -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-page: #080C14;
      --bg-surface: #0F172A;
      --bg-elevated: #1E293B;
      --bg-card: #131D31;
      --bg-code: #0A0F1D;
      
      --text-main: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      
      --primary: #38BDF8;
      --primary-hover: #0EA5E9;
      --accent-indigo: #818CF8;
      --accent-green: #34D399;
      --accent-amber: #FBBF24;
      --accent-rose: #FB7185;
      --border-color: #1E293B;
      --border-hover: #334155;
      
      --font-title: 'Outfit', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.65;
      font-size: 15px;
      padding-bottom: 90px;
      -webkit-font-smoothing: antialiased;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      position: relative;
      box-sizing: border-box;
    }

    /* Barra Superior de Herramientas y Navegación de Secciones */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 15, 29, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.18);
      padding: 10px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .top-bar-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-bar h1 {
      font-family: var(--font-title);
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-primary { background: rgba(56, 189, 248, 0.15); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.35); }
    .badge-gold { background: rgba(251, 191, 36, 0.15); color: var(--accent-amber); border: 1px solid rgba(251, 191, 36, 0.35); }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-select-wrapper {
      position: relative;
    }

    .section-select {
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px 12px;
      font-family: var(--font-body);
      font-size: 12.5px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      max-width: 200px;
    }
    .section-select:focus, .section-select:hover {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    .btn-print {
      background: linear-gradient(135deg, #0284C7, #2563EB);
      color: #FFF;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      white-space: nowrap;
    }
    .btn-print:hover {
      background: linear-gradient(135deg, #0369A1, #1D4ED8);
      transform: translateY(-1px);
    }

    /* Píldoras de Navegación de Secciones en el Navbar */
    .nav-sections {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 2px 6px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav-sections::-webkit-scrollbar {
      display: none;
    }

    .nav-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-chip:hover {
      color: #FFF;
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }
    .nav-chip.active {
      color: #38BDF8;
      font-weight: 600;
      background: rgba(14, 165, 233, 0.22);
      border-color: #38BDF8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .content h1, .content h2, .content h3, .content h4 {
      scroll-margin-top: 110px !important;
    }



    /* Contenedor Principal */
    .container {
      max-width: 980px;
      width: 100%;
      margin: 32px auto;
      padding: 0 20px;
      box-sizing: border-box;
      overflow-x: clip;
    }

    .content {
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
      box-sizing: border-box;
    }

    /* Formato de Markdown Renderizado */
    .content h1 {
      font-family: var(--font-title);
      font-size: 30px;
      font-weight: 800;
      color: #FFF;
      margin: 40px 0 16px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .content h1:first-child { margin-top: 0; }

    .content h2 {
      font-family: var(--font-title);
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin: 44px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(30, 41, 59, 0.8);
      letter-spacing: -0.01em;
    }

    .content h3 {
      font-family: var(--font-title);
      font-size: 17px;
      font-weight: 600;
      color: var(--accent-indigo);
      margin: 28px 0 12px;
    }

    .content h4 {
      font-family: var(--font-title);
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-green);
      margin: 22px 0 8px;
    }

    .content p {
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .content blockquote {
      background: rgba(19, 29, 49, 0.7);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      margin: 20px 0;
      border-radius: 0 8px 8px 0;
      color: #E2E8F0;
      font-style: italic;
    }

    .content ul, .content ol {
      margin-left: 24px;
      margin-bottom: 18px;
    }
    .content li {
      margin-bottom: 6px;
    }

    .content a {
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px dashed var(--primary);
    }
    .content a:hover {
      color: #7DD3FC;
      border-bottom-style: solid;
    }

    /* Tablas */
    .content table {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-collapse: separate;
      border-spacing: 0;
      margin: 24px 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .content th {
      background: var(--bg-elevated);
      color: #FFF;
      font-weight: 600;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    .content td {
      padding: 11px 16px;
      border-bottom: 1px solid rgba(30, 41, 59, 0.5);
      color: var(--text-secondary);
    }
    .content tr:last-child td { border-bottom: none; }
    .content tr:hover td { background: rgba(30, 41, 59, 0.4); }

    /* Código */
    .content pre {
      background: var(--bg-code);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
      width: 100%;
      margin: 20px 0;
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.5;
      box-sizing: border-box;
    }
    .content code {
      font-family: var(--font-code);
      font-size: 0.9em;
      background: rgba(30, 41, 59, 0.8);
      padding: 2px 6px;
      border-radius: 4px;
      color: #F43F5E;
    }
    .content pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    /* =====================================================================
       DISEÑO DE TARJETA INTERACTIVA DE DIAGRAMAS MERMAID
       ===================================================================== */
    .diagram-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      margin: 28px 0;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s ease;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      contain: paint;
    }
    .diagram-card:hover {
      border-color: var(--border-hover);
    }

    .diagram-header {
      background: #0E1626;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
      box-sizing: border-box;
    }

    .diagram-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .diagram-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swipe-hint {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-diagram {
      background: #1E293B;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      font-family: var(--font-body);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-diagram:hover {
      background: #334155;
      color: #FFF;
      border-color: var(--primary);
    }

    /* Scroll Horizontal Suave con Ancho Mínimo Legible y Fondo Técnico Blanco */
    .diagram-scroll {
      background: #FFFFFF;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 24px 20px;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      scrollbar-width: thin;
      scrollbar-color: #94A3B8 #F1F5F9;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    .diagram-scroll:active {
      cursor: grabbing;
    }
    .diagram-scroll::-webkit-scrollbar {
      height: 8px;
    }
    .diagram-scroll::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    .diagram-scroll::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    .diagram-scroll::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    .diagram-viewport {
      display: inline-block;
      min-width: 820px; /* Impide que el diagrama se encoja por debajo de su tamaño legible */
      width: 100%;
    }

    .diagram-viewport svg {
      width: 100% !important;
      height: auto !important;
      max-width: none !important;
      display: block;
    }

    /* =====================================================================
       MODAL DE PANTALLA COMPLETA CON ZOOM (FULLSCREEN MODAL)
       ===================================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      background: #0F172A;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 96vw;
      height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      background: #0B1120;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-zoom {
      background: #1E293B;
      color: #FFF;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-zoom:hover {
      background: #334155;
    }

    .btn-close {
      background: rgba(244, 63, 94, 0.2);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.4);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    .btn-close:hover {
      background: rgba(244, 63, 94, 0.35);
    }

    .modal-body {
      flex: 1;
      overflow: auto;
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      background: #111827;
    }
    .modal-body:active {
      cursor: grabbing;
    }

    .modal-content-svg {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center center;
    }
    .modal-content-svg {
      background: #FFFFFF;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-content-svg svg {
      width: auto !important;
      min-width: 900px;
      max-width: 1400px;
      height: auto !important;
      display: block;
    }

    /* =====================================================================
       ADAPTACIÓN MÓVIL (@media max-width: 768px)
       ===================================================================== */
    @media (max-width: 768px) {
      .container {
        padding: 0 14px;
        margin: 14px auto;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }
      .top-bar {
        padding: 8px 12px 6px;
        width: 100%;
        max-width: 100%;
      }
      .top-bar-main {
        gap: 6px;
        width: 100%;
      }
      .top-bar-left h1 {
        font-size: 13.5px;
      }
      .badge-primary {
        font-size: 9px;
        padding: 2px 5px;
      }
      .badge-gold {
        display: none;
      }
      .top-bar-right {
        gap: 6px;
      }
      .section-select {
        max-width: 120px;
        font-size: 11px;
        padding: 4px 6px;
      }
      .btn-print {
        padding: 5px 8px;
        font-size: 11px;
      }
      .btn-print .btn-text {
        display: none;
      }
      .content h1 {
        font-size: 22px;
        word-break: break-word;
      }
      .content h2 {
        font-size: 18px;
        scroll-margin-top: 105px !important;
        word-break: break-word;
      }
      .content h3 {
        font-size: 15px;
        word-break: break-word;
      }
      .content p, .content li {
        font-size: 14px;
      }
      .diagram-card {
        margin: 18px 0;
        border-radius: 10px;
        max-width: 100%;
        width: 100%;
      }
      .diagram-scroll {
        padding: 14px 10px;
        max-width: 100%;
        width: 100%;
      }
      .diagram-viewport {
        min-width: 660px;
      }
      .modal-container {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
      .modal-content-svg svg {
        min-width: 660px;
      }
    }

    /* =====================================================================
       ESTILOS EXCLUSIVOS PARA IMPRESIÓN Y PDF (@media print)
       ===================================================================== */
    @media print {
      body {
        background-color: #FFFFFF !important;
        color: #111827 !important;
        font-size: 10.5pt !important;
        line-height: 1.45 !important;
        padding: 0 !important;
      }
      .top-bar, .diagram-header, .swipe-hint, .btn-diagram, .modal-overlay { 
        display: none !important; 
      }
      .container {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .content h1 {
        color: #0F172A !important;
        border-bottom: 2px solid #CBD5E1 !important;
        page-break-before: always;
        padding-top: 10pt;
      }
      .content h1:first-of-type { page-break-before: avoid !important; }

      .content h2 {
        color: #0369A1 !important;
        border-bottom: 1px solid #E2E8F0 !important;
        page-break-after: avoid;
        page-break-inside: avoid;
        margin-top: 22pt !important;
      }

      .content h3, .content h4 {
        color: #1E293B !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }

      .content p, .content li {
        color: #334155 !important;
      }

      .content blockquote {
        background: #F8FAFC !important;
        border-left: 4px solid #0284C7 !important;
        color: #1E293B !important;
        page-break-inside: avoid;
      }

      .content table {
        background: #FFFFFF !important;
        border: 1px solid #CBD5E1 !important;
        page-break-inside: avoid;
      }
      .content th {
        background: #F1F5F9 !important;
        color: #0F172A !important;
        border-bottom: 1px solid #CBD5E1 !important;
      }
      .content td {
        color: #334155 !important;
        border-bottom: 1px solid #E2E8F0 !important;
      }

      .content pre {
        background: #F8FAFC !important;
        border: 1px solid #CBD5E1 !important;
        color: #0F172A !important;
        page-break-inside: avoid;
        font-size: 9pt !important;
      }

      .content code {
        background: #F1F5F9 !important;
        color: #BE123C !important;
      }

      .diagram-card {
        background: #FFFFFF !important;
        border: 1px solid #E2E8F0 !important;
        page-break-inside: avoid;
        box-shadow: none !important;
        margin: 14pt 0 !important;
      }
      .diagram-scroll {
        padding: 8pt !important;
        overflow: visible !important;
      }
      .diagram-viewport {
        min-width: 0 !important;
        width: 100% !important;
      }
      .diagram-viewport svg {
        width: 100% !important;
      }

      @page {
        size: A4 portrait;
        margin: 1.5cm;
      }
    }
  /* extra-summary-styles */

    .content blockquote {
      position: relative;
      margin: 18px 0;
      padding: 14px 18px;
      border-radius: 0 10px 10px 0;
      font-style: normal;
      line-height: 1.6;
    }
    .content blockquote:has(strong:contains("Resumen Técnico")),
    .content blockquote:has(strong) {
      border-left-width: 4px;
    }

</style>
</head>
<body>

  <!-- Barra Superior con Navegación de Secciones -->
  <header class="top-bar">
    <div class="top-bar-main">
      <div class="top-bar-left">
        <h1>⚡ VidalStore EP1</h1>
        <span class="badge badge-primary">Guía de Flujos</span>
        <span class="badge badge-gold">Defensa D6</span>
      </div>
      <div class="top-bar-right">
        <div class="section-select-wrapper">
          <select id="section-select" class="section-select" onchange="jumpToSection(this.value)">
            <option value="" disabled selected>📑 Ir a sección...</option>
          </select>
        </div>
        <button class="btn-print" onclick="window.print()">

  <script>
    // Inicializar Mermaid con tema oscuro legible de alto contraste
    mermaid.initialize({
      startOnLoad: false,
      theme: "default",
      themeVariables: {
        fontFamily: "Inter, -apple-system, sans-serif",
        fontSize: "14px",
        primaryColor: "#F0F9FF",
        primaryTextColor: "#0F172A",
        primaryBorderColor: "#0284C7",
        lineColor: "#0284C7",
        secondaryColor: "#F8FAFC",
        tertiaryColor: "#FFFFFF",
        actorBkg: "#F0F9FF",
        actorBorder: "#0284C7",
        actorTextColor: "#0F172A",
        actorLineColor: "#64748B",
        signalColor: "#0284C7",
        signalTextColor: "#0F172A",
        labelBoxBkgColor: "#FFFFFF",
        labelBoxBorderColor: "#CBD5E1",
        labelTextColor: "#0F172A",
        loopTextColor: "#0F172A",
        noteBorderColor: "#D97706",
        noteBkgColor: "#FEF3C7",
        noteTextColor: "#78350F",
        activationBorderColor: "#0284C7",
        activationBkgColor: "#BAE6FD"
      },
      sequence: {
        diagramMarginX: 20,
        diagramMarginY: 20,
        actorMargin: 60,
        width: 160,
        height: 55,
        boxMargin: 12,
        boxTextMargin: 6,
        noteMargin: 12,
        messageMargin: 40,
        mirrorActors: false
      }
    });

    let currentZoom = 1.0;

    function openModalWithSvg(svgHtml) {
      const modal = document.getElementById("zoom-modal");
      const container = document.getElementById("modal-content");
      container.innerHTML = svgHtml;
      currentZoom = 1.0;
      container.style.transform = "scale(1.0)";
      modal.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const modal = document.getElementById("zoom-modal");
      modal.classList.remove("active");
      document.body.style.overflow = "";
    }

    function zoomIn() {
      currentZoom = Math.min(currentZoom + 0.25, 3.0);
      document.getElementById("modal-content").style.transform = `scale(${currentZoom})`;
    }

    function zoomOut() {
      currentZoom = Math.max(currentZoom - 0.25, 0.6);
      document.getElementById("modal-content").style.transform = `scale(${currentZoom})`;
    }

    function resetZoom() {
      currentZoom = 1.0;
      document.getElementById("modal-content").style.transform = "scale(1.0)";
    }

    // Cerrar con Escape
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    async function cargarYRenderizar() {
      // 1. Obtener Markdown embebido
      const b64 = document.getElementById("b64-md").textContent.trim();
      const mdText = new TextDecoder("utf-8").decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
      
      // 2. Parsear Markdown con Marked
      marked.setOptions({
        gfm: true,
        breaks: false
      });
      document.getElementById("document-content").innerHTML = marked.parse(mdText);

      // Estilizar cajas de resúmenes
      document.querySelectorAll(".content blockquote").forEach(bq => {
        const text = bq.textContent;
        if (text.includes("Resumen Técnico")) {
          bq.style.background = "rgba(14, 27, 46, 0.85)";
          bq.style.borderLeft = "4px solid #38BDF8";
          bq.style.color = "#E2E8F0";
        } else if (text.includes("En Palabras Simples")) {
          bq.style.background = "rgba(15, 30, 24, 0.85)";
          bq.style.borderLeft = "4px solid #34D399";
          bq.style.color = "#E2E8F0";
        }
      });

      // 2.1 Construir Navegación de Secciones en el Navbar
      const navContainer = document.getElementById("nav-sections");
      const selectContainer = document.getElementById("section-select");
      if (navContainer && selectContainer) {
        navContainer.innerHTML = "";
        selectContainer.innerHTML = '<option value="" disabled selected>📑 Ir a sección...</option>';

        const h2s = document.querySelectorAll("#document-content h2");
        const sectionItems = [];

        const ICONS_MAP = [
          { match: "Índice", icon: "📑", label: "Índice" },
          { match: "Topología", icon: "🏗️", label: "Topología" },
          { match: "Flujo 1", icon: "🔐", label: "1. Identidad" },
          { match: "Flujo 2", icon: "🎮", label: "2. Catálogo" },
          { match: "Flujo 3", icon: "📚", label: "3. Biblioteca" },
          { match: "Flujo 4", icon: "💳", label: "4. Compra" },
          { match: "Flujo 5", icon: "🚫", label: "5. RBAC 403" },
          { match: "Flujo 6", icon: "🛡️", label: "6. Zero-Trust" },
          { match: "Flujo 7", icon: "🌱", label: "7. Seed/API" },
          { match: "Flujo 8", icon: "📝", label: "8. Auditoría" },
          { match: "Flujo 9", icon: "⚡", label: "9. Async L7" },
          { match: "Flujo 10", icon: "☠️", label: "10. DLQ" },
          { match: "Flujo 11", icon: "🔁", label: "11. Reintentos" },
          { match: "Flujo 12", icon: "🔒", label: "12. Idempotencia" },
          { match: "Flujo 13", icon: "⚙️", label: "13. MS Admin" },
          { match: "Flujo 14", icon: "🔄", label: "14. Reproceso" },
          { match: "Flujo 15", icon: "🐇", label: "15. Clúster" },
          { match: "Flujo 16", icon: "🧹", label: "16. Retención" },
          { match: "Defensa Verbal", icon: "⏱️", label: "18. Defensa 15m" },
          { match: "Demostración en Vivo", icon: "🎯", label: "19. Demo 11 Pasos" },
          { match: "Glosario", icon: "📖", label: "20. Glosario" },
          { match: "Diagnóstico en 4 Pasos", icon: "🔬", label: "21. Diagnóstico D9" },
          { match: "Catálogo Forense", icon: "🚨", label: "22. Catálogo Errores" }
        ];

        h2s.forEach((h2, idx) => {
          const text = h2.textContent.trim();
          const matchedConfig = ICONS_MAP.find(m => text.includes(m.match)) || {
            icon: "📌",
            label: text.slice(0, 15)
          };
          const secId = `seccion-${idx}`;
          h2.id = secId;

          // Generar slug normalizado sin acentos para anclas semánticas
          const slug = text.toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");
          h2.setAttribute("data-slug", slug);

          // Crear Chip en la barra
          const chip = document.createElement("a");
          chip.href = `#${secId}`;
          chip.className = "nav-chip";
          chip.setAttribute("data-target", secId);
          chip.innerHTML = `<span>${matchedConfig.icon}</span> <span>${matchedConfig.label}</span>`;
          chip.addEventListener("click", (e) => {
            e.preventDefault();
            jumpToSection(secId);
          });
          navContainer.appendChild(chip);

          // Crear Opción en Dropdown móvil
          const opt = document.createElement("option");
          opt.value = secId;
          opt.textContent = `${matchedConfig.icon} ${matchedConfig.label}`;
          selectContainer.appendChild(opt);

          sectionItems.push({ id: secId, el: h2, chip, slug });
        });

        // 2.2 Event listener para el dropdown móvil
        selectContainer.addEventListener("change", (e) => {
          if (e.target.value) {
            jumpToSection(e.target.value);
          }
        });

        // 2.3 Interceptar clics en enlaces internos (como la tabla de contenidos / Índice)
        document.getElementById("document-content").addEventListener("click", (e) => {
          const anchor = e.target.closest("a");
          if (!anchor) return;
          const href = anchor.getAttribute("href");
          if (!href || !href.startsWith("#") || href === "#") return;

          e.preventDefault();
          const rawTarget = href.slice(1);
          const decoded = decodeURIComponent(rawTarget).trim();

          // 1. Buscar por id exacto
          let targetEl = document.getElementById(rawTarget) || document.getElementById(decoded);

          // 2. Si es de la forma seccion-X o número X (ej: #seccion-2 o #2-flujo...)
          if (!targetEl) {
            const matchNum = decoded.match(/^(?:seccion-)?(\d+)/i);
            if (matchNum) {
              targetEl = document.getElementById(`seccion-${matchNum[1]}`);
            }
          }

          // 3. Buscar por coincidencia con data-slug o texto del heading
          if (!targetEl) {
            const normTarget = decoded.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
            const headings = document.querySelectorAll("#document-content h1, #document-content h2, #document-content h3");
            for (const h of headings) {
              const hSlug = (h.getAttribute("data-slug") || "").replace(/[^a-z0-9]/g, "");
              const hText = h.textContent.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
              if (hSlug && (hSlug.includes(normTarget) || normTarget.includes(hSlug))) {
                targetEl = h;
                break;
              }
              if (hText.includes(normTarget) || normTarget.includes(hText)) {
                targetEl = h;
                break;
              }
            }
          }

          if (targetEl && window.jumpToSection) {
            window.jumpToSection(targetEl.id);
          } else if (targetEl) {
            targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });

        // Función para centrar horizontalmente el chip activo SIN AFECTAR el scroll vertical de la ventana
        function scrollChipInNav(chip) {
          if (!navContainer || !chip) return;
          const containerWidth = navContainer.clientWidth;
          const chipLeft = chip.offsetLeft;
          const chipWidth = chip.offsetWidth;
          const targetLeft = chipLeft - (containerWidth / 2) + (chipWidth / 2);
          navContainer.scrollTo({
            left: Math.max(0, targetLeft),
            behavior: "smooth"
          });
        }

        let isProgrammaticScroll = false;
        let programmaticTimer = null;

        // Configurar ScrollSpy activo con IntersectionObserver
        const observer = new IntersectionObserver((entries) => {
          if (isProgrammaticScroll) return;
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const activeId = entry.target.id;
              sectionItems.forEach(item => {
                const isActive = item.id === activeId;
                item.chip.classList.toggle("active", isActive);
                if (isActive) {
                  scrollChipInNav(item.chip);
                  if (selectContainer.value !== activeId) {
                    selectContainer.value = activeId;
                  }
                }
              });
            }
          });
        }, {
          rootMargin: "-10% 0px -75% 0px",
          threshold: 0
        });

        sectionItems.forEach(item => observer.observe(item.el));

        window.jumpToSection = function(id) {
          if (!id) return;
          const el = document.getElementById(id);
          if (el) {
            isProgrammaticScroll = true;
            clearTimeout(programmaticTimer);

            sectionItems.forEach(item => {
              const isActive = item.id === id;
              item.chip.classList.toggle("active", isActive);
              if (isActive) scrollChipInNav(item.chip);
            });
            if (selectContainer.value !== id) {
              selectContainer.value = id;
            }

            el.scrollIntoView({ behavior: "smooth", block: "start" });
            history.replaceState(null, null, `#${id}`);

            programmaticTimer = setTimeout(() => {
              isProgrammaticScroll = false;
            }, 850);
          }
        };

        // Redirigir si la URL trae un hash inicial
        if (window.location.hash) {
          const initialHash = decodeURIComponent(window.location.hash.slice(1));
          setTimeout(() => {
            let targetEl = document.getElementById(initialHash);
            if (!targetEl) {
              const matchNum = initialHash.match(/^(?:seccion-)?(\d+)/i);
              if (matchNum) targetEl = document.getElementById(`seccion-${matchNum[1]}`);
            }
            if (targetEl && window.jumpToSection) {
              window.jumpToSection(targetEl.id);
            }
          }, 350);
        }
      }

      // 3. Transformar bloques de código language-mermaid en tarjetas interactivas
      const codeBlocks = document.querySelectorAll("pre code.language-mermaid, pre code.lang-mermaid");
      let diagCounter = 0;

      codeBlocks.forEach(codeEl => {
        diagCounter++;
        const pre = codeEl.closest("pre");
        const rawCode = codeEl.textContent;

        const card = document.createElement("div");
        card.className = "diagram-card";

        // Header interactivo
        const header = document.createElement("div");
        header.className = "diagram-header";
        header.innerHTML = `
          <div class="diagram-title">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
              <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zM2.5 2a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3zm6.5.5A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3zM1 10.5A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3zm6.5.5A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3z"/>
            </svg>
            Diagrama de Secuencia #${diagCounter}
          </div>
          <div class="diagram-controls">
            <span class="swipe-hint">↔️ Desliza horizontal</span>
            <button class="btn-diagram btn-fullscreen" title="Ver en pantalla completa con zoom">
              <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707zm4.344 0a.5.5 0 0 1 .707 0l4.096 4.096V11.5a.5.5 0 1 1 1 0v3.975a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1 0-1h2.768l-4.096-4.096a.5.5 0 0 1 0-.707zm0-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707zm-4.344 0a.5.5 0 0 1-.707 0L1.025 1.732V4.5a.5.5 0 0 1-1 0V.525a.5.5 0 0 1 .5-.5H4.5a.5.5 0 0 1 0 1H1.732l4.096 4.096a.5.5 0 0 1 0 .707z"/>
              </svg>
              Pantalla Completa
            </button>
          </div>
        `;

        // Área con scroll horizontal
        const scrollArea = document.createElement("div");
        scrollArea.className = "diagram-scroll";

        const viewport = document.createElement("div");
        viewport.className = "diagram-viewport";

        const mermaidDiv = document.createElement("div");
        mermaidDiv.className = "mermaid";
        mermaidDiv.textContent = rawCode;

        viewport.appendChild(mermaidDiv);
        scrollArea.appendChild(viewport);

        card.appendChild(header);
        card.appendChild(scrollArea);

        // Conectar botón pantalla completa
        header.querySelector(".btn-fullscreen").addEventListener("click", () => {
          openModalWithSvg(viewport.innerHTML);
        });

        // Doble clic en el diagrama también abre el modal
        scrollArea.addEventListener("dblclick", () => {
          openModalWithSvg(viewport.innerHTML);
        });

        pre.replaceWith(card);
      });

      // 4. Renderizar Diagramas con Mermaid
      try {
        await mermaid.run({
          querySelector: ".mermaid"
        });
        console.log("Todos los diagramas Mermaid se renderizaron exitosamente.");
      } catch (err) {
        console.error("Error renderizando diagramas Mermaid:", err);
      }

      // 5. Aplicar Highlight.js a bloques de código restantes
      try {
        if (typeof hljs !== 'undefined' && hljs.highlightElement) {
          document.querySelectorAll("pre code").forEach((block) => {
            try { hljs.highlightElement(block); } catch(e) {}
          });
        }
      } catch (e) {
        console.warn("Error en highlight.js:", e);
      }

      document.body.setAttribute("data-rendered", "true");
      console.log("data-rendered set to true successfully!");
    }

    window.addEventListener("DOMContentLoaded", cargarYRenderizar);
  </script>
</body>
</html>
